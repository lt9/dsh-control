name: check

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check src tests migrations
      # 测试用的是假面板与假主机（内存 SQLite），不需要 PostgreSQL，
      # 也不会碰到任何真实系统——这就是它能在 CI 里跑的原因。
      - name: pytest
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 类型检查
        run: npx tsc -b
      - name: 构建
        run: npm run build

  # 发布面里不许出现真实站点值与密钥形状。域名/IP 那两条由仓库自己的守卫测试
  # 负责（tests/unit/test_docs_have_no_site_values.py：只允许 RFC5737 文档段与
  # 公共基础设施域名）——那条测试跑在上面的 pytest 里，这里不重复实现，
  # 更不能在这里写死"我自己的域名"，那等于把要保护的东西贴进公开仓库。
  secret-shapes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 扫密钥形状
        run: |
          python - <<'PY'
          import pathlib, re, subprocess, sys
          bad = {
              "GitHub token": r"gh[pousr]_[A-Za-z0-9]{20,}",
              "云访问密钥": r"LTAI[A-Za-z0-9]{12,}",
              "私钥正文": r"BEGIN [A-Z ]*PRIVATE KEY",
              "32位十六进制密钥": r"\b[0-9a-f]{32}\b",
              "运维密钥明文": r"dshc-[A-Za-z0-9_-]{16,}",
          }
          files = subprocess.run(["git", "-c", "core.quotepath=off", "ls-files"],
                                 capture_output=True, text=True).stdout.split("\n")
          hits = []
          for f in filter(None, files):
              p = pathlib.Path(f)
              if not p.is_file():
                  continue          # 二进制与子模块同样跳过
              try:
                  text = p.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for n, line in enumerate(text.splitlines(), 1):
                  for name, pat in bad.items():
                      if re.search(pat, line):
                          hits.append(f"{p}:{n} 【{name}】")
          if hits:
              print("发现密钥形状：")
              print("\n".join(hits[:20]))
              sys.exit(1)
          print("没有密钥形状泄漏")
          PY
